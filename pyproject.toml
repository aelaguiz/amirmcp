[project]
name = "amirmcp"
version = "0.1.0"
description = "Read-only MCP connector that lets Amir's OpenAI dot see his Herdr coding sessions"
readme = "README.md"
authors = [
    { name = "Amir Elaguizy", email = "aelaguiz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "mcp>=2.1,<3",
]

[project.scripts]
amirmcp = "amirmcp.server:main"
amirmcp-panes = "amirmcp.herdr:dump_main"
amirmcp-pane = "amirmcp.control:pane_main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
